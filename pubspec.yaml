name: the_galvanometer_gallery
description: "A digital archive for collectors of early electrical physics apparatus — galvanometers, electroscopes, and 19th-century measurement instruments."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FAFAF8"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter_native_splash:
  color: "#FAFAF8"
  image: "assets/images/logo.png"
  android: true
  ios: true
  android_12:
    image: "assets/images/logo.png"
    icon_background_color: "#FAFAF8"
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
